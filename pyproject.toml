[build-system]
requires = [
    "hatchling>=1,<2",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"

[project]
name = "plinxore-target-s3"
dynamic = ["version"]
description = "Singer target for S3-compatible object storage (JSON/JSONL/CSV/Parquet), built with the Meltano Singer SDK. plinxore fork of crowemi/target-s3 with real gzip compression, robust datetime handling, and collision-safe batch file naming -- see NOTICE."
readme = "README.md"
authors = [{ name = "Ibrahim Gado Mayaki Hamza", email = "ibrahim.mayaki@plinxore.com" }]
keywords = [
    "ELT",
    "meltano",
    "singer-io",
    "s3",
    "aws",
    "jsonl",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9,<3.13"
dependencies = [
    # singer-sdk -> fs (via helpers/_batch.py) calls the deprecated
    # pkg_resources.declare_namespace() at import time, without pinning
    # setuptools tightly enough to guarantee it stays available: setuptools
    # >=81 dropped pkg_resources outright, so a fresh install can resolve a
    # setuptools that makes `import target_s3` crash immediately. Confirmed
    # by installing this exact wheel into a clean venv. Pinning here works
    # around fs's own underconstrained dependency, not something this
    # project's code does -- and not pyarrow: re-verified after bumping
    # pyarrow (10.0.1 -> 17.0.0) by removing this pin and reproducing the
    # same ModuleNotFoundError: 'pkg_resources' at the exact same import
    # (singer_sdk.helpers._batch -> fs), independent of pyarrow entirely.
    "setuptools<81",
    "requests==2.32.3",
    "singer-sdk==0.33.1",
    "smart-open[s3]==6.4.0",
    "pyarrow==17.0.0",
    # pyarrow==10.0.1 was compiled against numpy's 1.x C API and crashed
    # under numpy 2.x ("AttributeError: _ARRAY_API not found"); pyarrow
    # 17.0.0 is built numpy-2.x-ABI-compatible, confirmed by installing
    # this exact wheel with no numpy pin at all and running the full test
    # suite against it. First pinned to numpy==2.4.6 (0.1.5), which broke
    # the Python 3.10 CI leg: numpy>=2.4.0 requires Python>=3.11, silently
    # narrowing this package's actual supported range below what
    # requires-python (>=3.9,<3.13) advertised. numpy==2.0.2 is the
    # highest release with wheels across the full 3.9-3.12 range;
    # confirmed with clean installs and the full test suite (including
    # the Parquet schema-stability and decimal128-precision tests) under
    # all four of 3.9/3.10/3.11/3.12 -- 29 passed, 1 deselected, on every
    # version.
    "numpy==2.0.2",
    "boto3==1.24.59",
    "simplejson==3.20.1",
    # format_json.py imports `from bson import ObjectId` to stringify
    # MongoDB ObjectId values in its JSON serializer -- `bson` is pymongo's
    # bundled module, not a standalone package (a same-named but unrelated
    # `bson` package exists on PyPI and is not what's needed here). Grepping
    # for the literal string "pymongo" misses this since the code only
    # references the `bson` import name.
    "pymongo==4.11.3",
]

[project.urls]
Homepage   = "https://github.com/plinxore/target-s3"
Repository = "https://github.com/plinxore/target-s3"
Issues     = "https://github.com/plinxore/target-s3/issues"

[project.scripts]
# CLI declaration
target-s3 = "target_s3.target:Targets3.cli"

[dependency-groups]
dev = [
    { include-group = "test" },
    "black>=23.3.0",
    "isort>=5.10.1",
    "pydocstyle>=6.1.1",
    "mypy>=0.910",
    "types-requests>=2.26.1",
    "tox>=3.24.4",
]
test = [
    "pytest>=9",
    "moto[s3]~=4.2.14",
    "psutil>=5.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["target_s3"]

[tool.hatch.version]
source = "vcs"
fallback-version = "1.0.7.dev0"

[tool.pytest.ini_options]
markers = [
    "load: memory/throughput load tests processing >=1M synthetic records (slow, several minutes). Run explicitly with `pytest -m load`.",
]
addopts = "-m 'not load'"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "target_s3"
