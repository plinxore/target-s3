[build-system]
requires = [
    "hatchling>=1,<2",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"

[project]
name = "plinxore-target-s3"
dynamic = ["version"]
description = "Singer target for S3-compatible object storage (JSON/JSONL/CSV/Parquet), built with the Meltano Singer SDK. plinxore fork of crowemi/target-s3 with real gzip compression, robust datetime handling, and collision-safe batch file naming -- see NOTICE."
readme = "README.md"
authors = [{ name = "Ibrahim Gado Mayaki Hamza", email = "ibrahim.mayaki@plinxore.com" }]
keywords = [
    "ELT",
    "meltano",
    "singer-io",
    "s3",
    "aws",
    "jsonl",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9,<3.12"
dependencies = [
    "requests==2.32.3",
    "singer-sdk==0.33.1",
    "smart-open[s3]==6.4.0",
    "pyarrow==10.0.1",
    "pandas==1.5.3",
    "numpy==1.26.4",
    "fsspec==2022.11.0",
    "s3fs==2022.11.0",
    "pymongo==4.11.3",
    "boto3==1.24.59",
    "simplejson==3.20.1",
]

[project.urls]
Homepage   = "https://github.com/plinxore/target-s3"
Repository = "https://github.com/plinxore/target-s3"
Issues     = "https://github.com/plinxore/target-s3/issues"

[project.scripts]
# CLI declaration
target-s3 = "target_s3.target:Targets3.cli"

[dependency-groups]
dev = [
    { include-group = "test" },
    "black>=23.3.0",
    "isort>=5.10.1",
    "pydocstyle>=6.1.1",
    "mypy>=0.910",
    "types-requests>=2.26.1",
    "tox>=3.24.4",
]
test = [
    "pytest>=9",
    "moto[s3]~=4.2.14",
    "psutil>=5.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["target_s3"]

[tool.hatch.version]
source = "vcs"
fallback-version = "1.0.7.dev0"

[tool.pytest.ini_options]
markers = [
    "load: memory/throughput load tests processing >=1M synthetic records (slow, several minutes). Run explicitly with `pytest -m load`.",
]
addopts = "-m 'not load'"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "target_s3"
