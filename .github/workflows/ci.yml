name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tags, so the full history
          # is needed for the editable install to build.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the target and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9" "moto[s3]~=4.2.14" "psutil>=5.9.0"

      - name: Run tests (fast suite, excludes the >=1M-record load test)
        run: python -m pytest -v
