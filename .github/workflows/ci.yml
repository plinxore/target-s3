name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest>=9 (pinned below) requires Python >=3.10, so 3.9 is not
        # CI-tested even though requires-python (>=3.9,<3.13) still allows
        # it -- the runtime deps (pyarrow et al.) support 3.9 fine, only
        # this pinned test-tooling version doesn't.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tags, so the full history
          # is needed for the editable install to build.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the target and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9" "moto[s3]~=4.2.14" "psutil>=5.9.0"

      - name: Run tests (fast suite, excludes the >=1M-record load test)
        # test_core.py needs a live S3/MinIO endpoint (singer_sdk's own
        # get_target_test_class conformance suite) and hangs indefinitely
        # without one -- there's no MinIO service in this CI job, so it's
        # excluded here the same way it's excluded from every local run in
        # this repo's history. Covered separately against real MinIO.
        run: python -m pytest -v --ignore=target_s3/tests/test_core.py
